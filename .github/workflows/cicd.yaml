name: Build and push docker image.

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker build
        run: |
          docker build -t netflix_backend:latest .

      - name: Docker push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag netflix_backend:latest $ECR_REGISTRY/netflix-movie-backend:latest
          docker tag netflix_backend:latest $ECR_REGISTRY/netflix-movie-backend:v${{ github.run_number }}
          docker push $ECR_REGISTRY/netflix-movie-backend:latest
          docker push $ECR_REGISTRY/netflix-movie-backend:v${{ github.run_number }}
